# ─────────────────────────────────────────────────────────────────────────────
# GENERATED FILE — do not edit the inputs or env sections by hand.
# Edit src/config/schema.ts and run `npm run gen:action` to regenerate.
# CI runs `npm run check:action` to reject drift.
# ─────────────────────────────────────────────────────────────────────────────
name: 'AI PR Review Action'
description: 'Comprehensive AI-powered code review for TypeScript/Angular/LoopBack4 projects with parallel specialist agents'
author: 'SourceFuse'

branding:
  icon: 'eye'
  color: 'blue'

inputs:
  # ─── Required ────────────────────────────────────────────
  github_token:
    description: 'GitHub token for PR access (usually secrets.GITHUB_TOKEN)'
    required: true
  anthropic_auth_token:
    description: 'API key for the AI endpoint (Anthropic, z.ai/GLM, OpenRouter, OpenAI, or any compatible provider)'
    required: true
  # ─── Provider Configuration ──────────────────────────────
  ai_provider:
    description: 'API dialect: ''anthropic'' for Anthropic-compatible endpoints (default, the existing behavior); ''openai'' for OpenAI-compatible /chat/completions endpoints (OpenAI, OpenRouter, z.ai coding API, local servers). The anthropic_* inputs apply to whichever dialect is selected'
    required: false
    default: 'anthropic'
  anthropic_base_url:
    description: 'Base URL for the AI API. Change for z.ai/GLM, OpenRouter, OpenAI, or custom endpoints'
    required: false
    default: 'https://api.anthropic.com'
  anthropic_model:
    description: 'Model id, or a comma-separated fallback chain tried in order (the next is used only when a model is rejected as unknown by the endpoint). Default tries GLM-5.2, then its 1M variant, then a Claude-tier name the z.ai endpoint maps to GLM'
    required: false
    default: 'glm-5.2,glm-5.2[1m],claude-opus-4-8'
  max_tokens:
    description: '0 (default) = auto: use the model''s full native output capacity (e.g. 131072 on GLM-5.2) so a review is never truncated by a self-imposed cap; if an endpoint advertises a smaller maximum in its rejection, it is discovered and latched automatically. Set a positive number to cap output tokens manually'
    required: false
    default: '0'
  thinking_budget:
    description: 'Extended-thinking budget in tokens, added on top of max_tokens. NOTE: GLM endpoints treat thinking as on/off and do NOT enforce this budget — with the default max_tokens auto mode the full output capacity absorbs even a long think. Set 0 to disable thinking. Auto-disabled if the endpoint rejects the thinking param'
    required: false
    default: '4096'
  context_window:
    description: 'Total context window of the target model, in tokens. The prompt is trimmed to fit within this minus reserved output, avoiding model_context_window_exceeded. Default 1000000 (GLM-5.2 / Opus 4.8); if a request still overflows after a fallback to a smaller model, the compact retry recovers it'
    required: false
    default: '1000000'
  temperature:
    description: 'AI temperature (0.0 - 1.0)'
    required: false
    default: '0.2'
  # ─── Review Mode ─────────────────────────────────────────
  review_mode:
    description: 'combined (default): one comprehensive all-at-once review covering every category. separate: 7 parallel specialist agents selected by review_profile/toggles'
    required: false
    default: 'combined'
  review_profile:
    description: 'Review intensity for separate mode: strict (all 7 agents), standard (5 agents), minimal (2 agents). Ignored in combined mode'
    required: false
    default: 'standard'
  # ─── Individual Review Toggles (override profile) ────────
  enable_security_review:
    description: 'Enable/disable the security review agent in separate mode (true/false overrides the profile; empty follows the profile)'
    required: false
    default: ''
  enable_code_quality_review:
    description: 'Enable/disable the code quality review agent in separate mode (true/false overrides the profile; empty follows the profile)'
    required: false
    default: ''
  enable_performance_review:
    description: 'Enable/disable the performance review agent in separate mode (true/false overrides the profile; empty follows the profile)'
    required: false
    default: ''
  enable_type_safety_review:
    description: 'Enable/disable the type safety review agent in separate mode (true/false overrides the profile; empty follows the profile)'
    required: false
    default: ''
  enable_architecture_review:
    description: 'Enable/disable the architecture review agent in separate mode (true/false overrides the profile; empty follows the profile)'
    required: false
    default: ''
  enable_testing_review:
    description: 'Enable/disable the testing review agent in separate mode (true/false overrides the profile; empty follows the profile)'
    required: false
    default: ''
  enable_api_design_review:
    description: 'Enable/disable the api design review agent in separate mode (true/false overrides the profile; empty follows the profile)'
    required: false
    default: ''
  # ─── Framework Configuration ─────────────────────────────
  framework:
    description: 'Framework for prompt additions: angular, loopback4, both, generic (none), auto (detect from repo)'
    required: false
    default: 'auto'
  # ─── GitHub ──────────────────────────────────────────────
  pr_number:
    description: 'Pull request number to review. Defaults to the PR of the triggering pull_request event'
    required: false
    default: ''
  # ─── JIRA Integration (optional, fault-tolerant) ─────────
  jira_url:
    description: 'JIRA instance URL (e.g., https://company.atlassian.net)'
    required: false
    default: ''
  jira_email:
    description: 'JIRA user email for API authentication'
    required: false
    default: ''
  jira_api_token:
    description: 'JIRA API token'
    required: false
    default: ''
  jira_project_key:
    description: 'JIRA project key for ticket validation (e.g., PLM, PROJ)'
    required: false
    default: ''
  # ─── Behavior Flags ──────────────────────────────────────
  fail_on_critical:
    description: 'Fail the action (exit code 1) when findings at or above fail_threshold exist'
    required: false
    default: 'false'
  fail_threshold:
    description: 'Minimum severity to fail: critical, high, medium'
    required: false
    default: 'critical'
  post_inline_comments:
    description: 'Post inline review comments on specific diff lines'
    required: false
    default: 'true'
  post_data_url:
    description: 'Optional Backstage/webhook endpoint. When set, review metrics and all individual findings are POSTed as JSON after the review — including skip/failure runs, so the tracker sees every run (fire-and-forget, never fails the action). See docs/backstage-integration.md'
    required: false
    default: ''
  enable_reply_handling:
    description: 'Verify human replies on previous review threads against the code, post a justification reply in each, and resolve the thread when the reply is valid'
    required: false
    default: 'true'
  enable_bot_comment_cleanup:
    description: 'Minimize noisy recurring bot comments (e.g. sonarqubecloud, unit-test-quality reports): known noise is hidden entirely, other recurring types keep only the latest occurrence'
    required: false
    default: 'true'
  max_files_to_review:
    description: 'Skip review if PR has more changed files than this'
    required: false
    default: '50'
  exclude_patterns:
    description: 'Comma-separated glob patterns to exclude (appended to built-in defaults: package-lock, openapi.json, migrations, .bpmn, dist, node_modules, .d.ts, etc.)'
    required: false
    default: ''
  include_patterns:
    description: 'Comma-separated glob patterns to include (if set, only these are reviewed)'
    required: false
    default: ''
  enable_context_tools:
    description: 'Let the reviewer model fetch missing context itself via bounded local-repo tools (read_file, grep, find_references, list_dir). Hard-capped: at most 2 extra AI turns per review and 12 tool calls per run; requires the local-clone context engine (falls back to no tools when unavailable)'
    required: false
    default: 'true'
  related_context:
    description: 'How much unchanged-file context is fetched for the reviewer: full (import graph incl. tsconfig path aliases, npm-workspace packages and barrel re-exports, plus framework expansion — Angular sibling templates/styles/modules, LoopBack4 string-key DI bindings), imports-only (import graph only), off (none)'
    required: false
    default: 'full'
  # ─── Prompt Customization ────────────────────────────────
  system_prompt_override:
    description: 'Full replacement of the default system prompt (replaces all built-in prompts)'
    required: false
    default: ''
  system_prompt_append:
    description: 'Text appended to the default system prompt (adds to built-in prompts)'
    required: false
    default: ''
  angular_prompt_append:
    description: 'Additional instructions appended for Angular-specific reviews'
    required: false
    default: ''
  loopback4_prompt_append:
    description: 'Additional instructions appended for LoopBack4-specific reviews'
    required: false
    default: ''
  # ─── Comment Configuration ───────────────────────────────
  comment_header:
    description: 'Custom header for the review summary comment'
    required: false
    default: 'AI Code Review'
  comment_footer:
    description: 'Custom footer text for the review summary comment'
    required: false
    default: ''
  # ─── Diagrams ────────────────────────────────────────────
  enable_diagrams:
    description: 'Generate AI Mermaid diagrams (validated via Kroki.io, rendered natively by GitHub) in the PR description'
    required: false
    default: 'true'
  # ─── Advanced ────────────────────────────────────────────
  agent_timeout:
    description: 'Timeout in seconds for each review agent AI call. 800 leaves headroom for slow endpoint spells: glm-5.2 streams all thinking before writing findings, and a timeout mid-thought yields 0 findings'
    required: false
    default: '800'
  max_retries:
    description: 'Maximum retries per agent on transient AI API failure (5xx/network). Rate limits (429) retry on their own patient budget — up to 400 attempts with escalating waits (10s up to 2min, max 5h total, riding out fair-usage throttling spells) — independent of this setting'
    required: false
    default: '3'
  cancel_on_pr_close:
    description: 'Cancel the review run (neutral exit, not a failure) if the PR is closed or merged while the review is still running, freeing the runner and AI quota'
    required: false
    default: 'true'
  debug:
    description: 'Enable debug logging'
    required: false
    default: 'false'

outputs:
  review_status:
    description: 'Review status: completed, skipped'
  skip_reason:
    description: 'Reason for skipping: too_many_files, no_agents (empty if not skipped)'
  review_comment_id:
    description: 'ID of the review summary comment posted on the PR'
  review_comment_url:
    description: 'URL of the review summary comment'
  total_findings:
    description: 'Total number of findings across all agents'
  critical_count:
    description: 'Number of critical severity findings'
  high_count:
    description: 'Number of high severity findings'
  medium_count:
    description: 'Number of medium severity findings'
  low_count:
    description: 'Number of low severity findings'
  nit_count:
    description: 'Number of nit severity findings'
  review_passed:
    description: 'Whether the review passed (no findings at or above fail_threshold)'
  agents_run:
    description: 'Comma-separated list of agents that ran'
  agents_failed:
    description: 'Comma-separated list of agents that failed (if any)'
  duration_seconds:
    description: 'Total review duration in seconds'
  backstage_reported:
    description: 'Whether review data was successfully POSTed to post_data_url (true/false, empty if post_data_url not set)'
  replies_posted:
    description: 'Number of justification replies posted on review threads that had human replies'
  threads_resolved_from_replies:
    description: 'Number of threads resolved because a human reply was verified as valid'
  bot_comments_hidden:
    description: 'Number of noisy bot comments minimized during cleanup'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GITHUB_TOKEN: ${{ inputs.github_token }}
    INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
    INPUT_ANTHROPIC_AUTH_TOKEN: ${{ inputs.anthropic_auth_token }}
    INPUT_AI_PROVIDER: ${{ inputs.ai_provider }}
    INPUT_ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url }}
    INPUT_ANTHROPIC_MODEL: ${{ inputs.anthropic_model }}
    INPUT_MAX_TOKENS: ${{ inputs.max_tokens }}
    INPUT_THINKING_BUDGET: ${{ inputs.thinking_budget }}
    INPUT_CONTEXT_WINDOW: ${{ inputs.context_window }}
    INPUT_TEMPERATURE: ${{ inputs.temperature }}
    INPUT_REVIEW_MODE: ${{ inputs.review_mode }}
    INPUT_REVIEW_PROFILE: ${{ inputs.review_profile }}
    INPUT_ENABLE_SECURITY_REVIEW: ${{ inputs.enable_security_review }}
    INPUT_ENABLE_CODE_QUALITY_REVIEW: ${{ inputs.enable_code_quality_review }}
    INPUT_ENABLE_PERFORMANCE_REVIEW: ${{ inputs.enable_performance_review }}
    INPUT_ENABLE_TYPE_SAFETY_REVIEW: ${{ inputs.enable_type_safety_review }}
    INPUT_ENABLE_ARCHITECTURE_REVIEW: ${{ inputs.enable_architecture_review }}
    INPUT_ENABLE_TESTING_REVIEW: ${{ inputs.enable_testing_review }}
    INPUT_ENABLE_API_DESIGN_REVIEW: ${{ inputs.enable_api_design_review }}
    INPUT_FRAMEWORK: ${{ inputs.framework }}
    INPUT_PR_NUMBER: ${{ inputs.pr_number }}
    INPUT_JIRA_URL: ${{ inputs.jira_url }}
    INPUT_JIRA_EMAIL: ${{ inputs.jira_email }}
    INPUT_JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
    INPUT_JIRA_PROJECT_KEY: ${{ inputs.jira_project_key }}
    INPUT_FAIL_ON_CRITICAL: ${{ inputs.fail_on_critical }}
    INPUT_FAIL_THRESHOLD: ${{ inputs.fail_threshold }}
    INPUT_POST_INLINE_COMMENTS: ${{ inputs.post_inline_comments }}
    INPUT_POST_DATA_URL: ${{ inputs.post_data_url }}
    INPUT_ENABLE_REPLY_HANDLING: ${{ inputs.enable_reply_handling }}
    INPUT_ENABLE_BOT_COMMENT_CLEANUP: ${{ inputs.enable_bot_comment_cleanup }}
    INPUT_MAX_FILES_TO_REVIEW: ${{ inputs.max_files_to_review }}
    INPUT_EXCLUDE_PATTERNS: ${{ inputs.exclude_patterns }}
    INPUT_INCLUDE_PATTERNS: ${{ inputs.include_patterns }}
    INPUT_ENABLE_CONTEXT_TOOLS: ${{ inputs.enable_context_tools }}
    INPUT_RELATED_CONTEXT: ${{ inputs.related_context }}
    INPUT_SYSTEM_PROMPT_OVERRIDE: ${{ inputs.system_prompt_override }}
    INPUT_SYSTEM_PROMPT_APPEND: ${{ inputs.system_prompt_append }}
    INPUT_ANGULAR_PROMPT_APPEND: ${{ inputs.angular_prompt_append }}
    INPUT_LOOPBACK4_PROMPT_APPEND: ${{ inputs.loopback4_prompt_append }}
    INPUT_COMMENT_HEADER: ${{ inputs.comment_header }}
    INPUT_COMMENT_FOOTER: ${{ inputs.comment_footer }}
    INPUT_ENABLE_DIAGRAMS: ${{ inputs.enable_diagrams }}
    INPUT_AGENT_TIMEOUT: ${{ inputs.agent_timeout }}
    INPUT_MAX_RETRIES: ${{ inputs.max_retries }}
    INPUT_CANCEL_ON_PR_CLOSE: ${{ inputs.cancel_on_pr_close }}
    INPUT_DEBUG: ${{ inputs.debug }}
