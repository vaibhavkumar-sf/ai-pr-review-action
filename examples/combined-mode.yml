# Combined mode (default) — one exhaustive all-at-once review with Backstage reporting
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write  # push access is required to resolve/unresolve review threads
  pull-requests: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: |
      !contains(github.actor, '[bot]') &&
      !contains(github.head_ref, '-via-ai')
    steps:
      - uses: sourcefuse/ai-pr-review-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_auth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic_base_url: ${{ secrets.ANTHROPIC_BASE_URL }}

          # One comprehensive review covering all categories at once.
          # Every finding is still tagged security/performance/etc + severity.
          review_mode: 'combined'

          # JIRA context (optional)
          jira_url: ${{ secrets.JIRA_URL }}
          jira_email: ${{ secrets.JIRA_EMAIL }}
          jira_api_token: ${{ secrets.JIRA_TOKEN }}
          jira_project_key: 'TEL'

          # Report metrics + all individual findings to Backstage
          post_data_url: ${{ secrets.AI_REVIEW_POST_DATA_URL }}

          fail_on_critical: 'false'
