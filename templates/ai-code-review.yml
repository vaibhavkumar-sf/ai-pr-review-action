##############################################################################
# AI Code Review - Workflow Template
#
# Copy this file to your repository at:
# .github/workflows/ai-code-review.yml
#
# Required Secrets (Global Organization Secrets):
# - ANTHROPIC_AUTH_TOKEN     (AI provider API key)
# - ANTHROPIC_BASE_URL       (AI provider endpoint)
#
# Optional Secrets:
# - JIRA_URL, JIRA_EMAIL, JIRA_TOKEN   (JIRA ticket context, fault-tolerant)
# - AI_REVIEW_POST_DATA_URL            (Backstage tracker endpoint - review
#                                       metrics + findings are POSTed there;
#                                       see docs/backstage-integration.md)
#
# GITHUB_TOKEN is provided automatically by GitHub Actions.
#
# Customization:
# 1. Update the action ref: sourcefuse/ai-pr-review-action@main (or a tag)
# 2. Set review_mode: combined (one exhaustive all-at-once review, default)
#    or separate (7 parallel specialist agents selected by review_profile)
# 3. review_profile applies to separate mode only: strict | standard | minimal
# 4. Configure trigger branches and jira_project_key
# 5. Project-specific prompt rules can be added after merge via the
#    loopback4_prompt_append / angular_prompt_append / system_prompt_append
#    inputs (multiline values - add them manually, not via the scaffolder)
##############################################################################

name: AI Code Review

on:
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip bot PRs and AI-generated branches
    if: |
      !contains(github.actor, '[bot]') &&
      !contains(github.head_ref, '-via-ai') &&
      !contains(github.head_ref, '-Via-AI')
    steps:
      - uses: sourcefuse/ai-pr-review-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_auth_token: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          anthropic_base_url: ${{ secrets.ANTHROPIC_BASE_URL }}

          # Review mode: combined (all-at-once, /review2 style) or separate (specialist agents)
          review_mode: 'combined'

          # Review profile (separate mode only)
          review_profile: 'standard'

          # JIRA integration (optional, fault-tolerant)
          jira_url: ${{ secrets.JIRA_URL }}
          jira_email: ${{ secrets.JIRA_EMAIL }}
          jira_api_token: ${{ secrets.JIRA_TOKEN }}
          jira_project_key: 'TEL'

          # Backstage reporting (optional - metrics + all findings POSTed as JSON)
          post_data_url: ${{ secrets.AI_REVIEW_POST_DATA_URL }}

          # Don't fail PRs on findings (set to 'true' to enforce)
          fail_on_critical: 'false'

          # Advanced
          debug: 'false'
